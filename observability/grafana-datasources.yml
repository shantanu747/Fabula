# Auto-provisioned so a fresh `docker compose up` needs no manual datasource
# clicking — Grafana reads this on startup (mounted at
# /etc/grafana/provisioning/datasources/datasources.yml).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
