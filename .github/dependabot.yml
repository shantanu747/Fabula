version: 2

updates:
  # Grouped rather than one PR per package: this repo's dependency count makes
  # ungrouped Dependabot pure noise nobody reads. Patch/minor bumps are
  # low-risk and safe to land together; majors get their own PR each since
  # those are the ones actually worth reviewing individually.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["patch", "minor"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      # vitest and @vitest/coverage-v8 are separately-versioned packages with
      # a hard peer dependency — coverage-v8@N requires vitest@N exactly —
      # so bumping one without the other isn't "review each major
      # separately", it's an unresolvable `npm ci` (ERESOLVE) on every PR
      # until a human manually combines them. Grouping regardless of
      # update-type keeps them moving together, same fix as the
      # codeql-action group below for the same class of problem.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # github/codeql-action ships init/analyze/autobuild/upload-sarif as
      # separate `uses:` references within one repo, and codeql.yml pins each
      # independently — Dependabot tracks each reference as its own update,
      # so without this group a bump lands as two (or more) separate PRs.
      # Applying only one leaves init/analyze on mismatched versions, which
      # the action itself refuses to run: "Loaded a configuration file for
      # version 'X', but running version 'Y'" — a same-day incident, not a
      # hypothetical. Grouping forces every codeql-action reference to move
      # together in one PR.
      codeql-action:
        patterns: ["github/codeql-action/*"]
