name: Eval drift (nightly)

# Layer 3 of the eval harness (docs/plans/v3/01): calls the real providers for
# the full matrix, judges live, and compares against the committed
# evals/baseline.json. Costs tokens on every run; never blocks a PR. This is
# the tripwire for a provider silently changing a model behind a stable name.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  eval-drift:
    runs-on: ubuntu-latest
    # actions: read is needed to list/download the previous run's eval-report
    # artifact for the drift debounce (docs/adr/0028); contents: read is the
    # normal minimum for checkout once permissions are declared explicitly.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Same pinning as ci.yml — see docs/adr/0012-ci-npm-version-pinning.md.
      - run: npm i -g npm@11

      - run: npm ci

      # No-op noisily, not silently: if any key is absent the job must fail
      # here, before a single token is spent. A scheduled workflow that goes
      # quietly green because keys are missing is worse than a failure mail.
      - name: Check provider keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$OPENAI_API_KEY" ] && missing="$missing OPENAI_API_KEY"
          [ -z "$OPENROUTER_API_KEY" ] && missing="$missing OPENROUTER_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::eval-drift needs these repo secrets but they are unset:$missing"
            exit 1
          fi

      # Score-based checks (drift, pooled means) are single noisy LLM-judge
      # samples — see docs/adr/0028. They only fail the job once the same
      # check also failed last night, so this fetches last night's raw
      # failure keys (best-effort: a first run, or an expired/missing
      # artifact, just means everything tonight starts as "pending").
      - name: Fetch previous night's report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=eval-report&per_page=1" --jq '.artifacts[0].workflow_run.id // empty')
          if [ -n "$prev_run_id" ]; then
            gh run download "$prev_run_id" -n eval-report -D previous-report 2>/dev/null || true
          fi
          if [ -f previous-report/report.json ]; then
            echo "EVAL_PREVIOUS_REPORT=previous-report/report.json" >> "$GITHUB_ENV"
          else
            echo "no previous eval-report artifact found — every failure tonight starts as pending"
          fi

      - name: Live eval against the full matrix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run eval:live

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            evals/report.md
            evals/report.json
          if-no-files-found: warn
