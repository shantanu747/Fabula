name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches new advisories against code that hasn't changed recently — a
    # push/PR-only trigger would never re-scan a stable file for a query
    # added to CodeQL's own ruleset after it last touched this repo.
    - cron: "17 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Default query suite, not security-extended: the CodeQL CLI isn't
      # available in this dev environment to benchmark the two locally, so
      # this starts from GitHub's own documented default rather than a
      # verified measurement. Revisit if the first real run on `main` is slow
      # or noisy, or once security-extended can actually be compared against
      # it — see docs/adr/0024.
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
