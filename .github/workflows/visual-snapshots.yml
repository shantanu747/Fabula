name: Update visual snapshots

# Manual only — dispatched from the branch whose visual.spec.ts baselines
# need regenerating (a new checkpoint, an intentional visual change). See
# e2e/README.md's "Updating visual regression snapshots" for the full flow.
# Snapshots must come from this workflow, never a local machine: font hinting
# and subpixel rendering differ enough between macOS and this runner that a
# locally-generated snapshot fails CI on anti-aliasing alone.
on:
  workflow_dispatch:

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:4444/fabula_e2e
      NEON_FETCH_ENDPOINT: http://db.localtest.me:4444/sql
      AUTH_SECRET: ci-placeholder-secret
      E2E_NEON_PROXY_HOST: db.localtest.me:4444
      # e2e/global-setup.ts (docs/adr/0035, docs/adr/0036) checks Redis
      # reachability for every e2e run, this one included.
      KV_REST_API_URL: http://localhost:8079
      KV_REST_API_TOKEN: ci-placeholder-token
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/fabula_e2e
        ports:
          - 4444:4444
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      serverless-redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-placeholder-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm i -g npm@11

      - run: npm ci

      - name: Wait for the Neon HTTP proxy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4444/sql \
              -H "Content-Type: application/json" -d '{}' || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "proxy responded with HTTP $code"
              exit 0
            fi
            sleep 1
          done
          echo "Neon HTTP proxy never became reachable at localhost:4444" >&2
          exit 1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e:visual:update

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots
          path: e2e/specs/visual.spec.ts-snapshots/
          retention-days: 7
