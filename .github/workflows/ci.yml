name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # next build touches these at module scope (lazy client construction still needs
      # the key to be a defined string) but never calls out to a real provider/database
      # during the build itself.
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
      OPENROUTER_API_KEY: test-key
      DATABASE_URL: postgres://user:pass@localhost:5432/fabula
      AUTH_SECRET: ci-placeholder-secret
      # store.parity.db.test.ts and lease.db.test.ts (docs/adr/0035) need a real
      # Redis; every other test in this job explicitly neutralizes these two vars
      # in its own setup so an ambient value here can't silently redirect an
      # unrelated test's rate-limit/admission/budget check to Redis instead of
      # the Postgres path it's named for (see kv/client.test.ts's comment).
      KV_REST_API_URL: http://localhost:8079
      KV_REST_API_TOKEN: ci-placeholder-token
    # The `db` Vitest project (src/test/global-setup-db.ts) needs a real Postgres
    # to clone its per-worker template from — it fails loudly rather than skipping
    # silently if it can't reach one. User/password/port match the default
    # TEST_DB_BASE_URL in src/test/db-names.ts, so no TEST_DATABASE_URL override
    # is needed here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # `@upstash/redis` speaks Upstash's HTTP REST protocol, not the Redis wire
      # protocol, so the production client can't talk to the `redis` service
      # above directly — this proxy gives it the same protocol Upstash's own
      # endpoint speaks, exact parity with the Neon HTTP proxy's role for
      # Postgres (docs/adr/0035, docs/plans/v4/README.md).
      serverless-redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-placeholder-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # package-lock.json is authored by npm 11, but Node 22 bundles npm 10, and the two
      # resolve this dependency set into different trees — npm 10 rejects an npm 11 lockfile
      # as out-of-sync (EUSAGE). Pin npm explicitly rather than relying on whichever version
      # a given Node release happens to bundle, so a future node-version bump can't silently
      # reintroduce the mismatch. See docs/adr/0012-ci-npm-version-pinning.md.
      - run: npm i -g npm@11

      - run: npm ci

      # Fails on high/critical only. Moderate advisories in the transitive dev tree
      # are common enough that failing on them trains everyone to ignore this step.
      # See docs/adr/0024 for the currently-accepted moderate findings.
      - run: npm audit --audit-level=high

      - run: npm run lint

      # Catches a schema.ts change whose migration was never generated, and a
      # migration missing from meta/_journal.json. Both have already shipped
      # here once (docs/adr/0017), and neither is visible to lint, tests, or the
      # build — the db suite runs migrations, so it catches an unlisted one, but
      # only drizzle-kit catches an unwritten one.
      - run: npx drizzle-kit check

      # --coverage, not a bare `npm test`: the thresholds in vitest.config.mts
      # are the point, and they gate nothing unless coverage actually runs.
      - run: npm run test:coverage

      # Replay-only: no provider keys, no tokens spent. Fails on a stale fixture,
      # which is what stops a prompt change from coasting on old recordings.
      - run: npm run eval

      - run: npm run build

  quality:
    runs-on: ubuntu-latest
    # Parallel to `build` and `e2e`, not chained after either — see
    # docs/adr/0027. Its own `next build` (needed for the bundle-budget
    # check below) reuses the same module-scope-only env as the `build`
    # job's, for the same reason.
    env:
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
      OPENROUTER_API_KEY: test-key
      DATABASE_URL: postgres://user:pass@localhost:5432/fabula
      AUTH_SECRET: ci-placeholder-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # See docs/adr/0012 — same reasoning as the build job above.
      - run: npm i -g npm@11

      - run: npm ci

      # Standalone (tsc --noEmit), so a type error is visible within seconds
      # of this job starting rather than after the slower jobs' own steps.
      - run: npm run typecheck

      - run: npm run test:scripts

      - run: npm run build

      # First-load JS for the budgeted routes, against budgets.json. Every
      # runner checkout is cold, so this always measures a fresh .next —
      # see AGENTS.md's note on rm -rf .next for reproducing this locally.
      - run: npm run bundle-budget

  e2e:
    runs-on: ubuntu-latest
    # Parallel to `build`, not chained after it — this job does its own
    # `next build` inside Playwright's webServer, pointed at the harness's own
    # database and mock provider rather than the placeholder values above.
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:4444/fabula_e2e
      NEON_FETCH_ENDPOINT: http://db.localtest.me:4444/sql
      AUTH_SECRET: ci-placeholder-secret
      # host.docker.internal (README's local dev instructions) doesn't resolve
      # on Linux runners — the proxy service reaches Postgres over the
      # Actions-provided network by service name instead (see the neon-proxy
      # service below). Playwright's own db.localtest.me:4444 default (which
      # resolves to 127.0.0.1) still works for the *runner's* own connections,
      # since both services publish to the runner's localhost too.
      E2E_NEON_PROXY_HOST: db.localtest.me:4444
      # Admission control (docs/adr/0035, docs/adr/0036) needs a real Redis to
      # be exercised at all — with none configured it fails open, and
      # concurrent-generation.spec.ts's refusal assertion would never fire.
      # localhost, not the service name: this is consumed by the app process
      # Playwright's own webServer spawns on the runner itself, not by another
      # container — same reasoning as db.localtest.me:4444 above.
      KV_REST_API_URL: http://localhost:8079
      KV_REST_API_TOKEN: ci-placeholder-token
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          # "postgres" is the service hostname above, reachable from this
          # container on the Actions-provided Docker network. fabula_e2e is
          # created later by Playwright's global-setup.ts, before the app
          # itself ever queries through this proxy — the proxy connects
          # lazily per-request, so it doesn't need the database to exist yet.
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/fabula_e2e
        ports:
          - 4444:4444
      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      serverless-redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-placeholder-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # See docs/adr/0012 — same reasoning as the build job above.
      - run: npm i -g npm@11

      - run: npm ci

      - name: Wait for the Neon HTTP proxy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4444/sql \
              -H "Content-Type: application/json" -d '{}' || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "proxy responded with HTTP $code"
              exit 0
            fi
            sleep 1
          done
          echo "Neon HTTP proxy never became reachable at localhost:4444" >&2
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Pixel-fidelity regression (docs/plans/v4/08-ui-redesign-followups.md),
  # deliberately its own job rather than folded into `e2e`: it's slower
  # (fifteen checkpoints × five projects) and a fidelity failure shouldn't
  # block a behavioral fix from merging while the design owner decides
  # whether the new pixels are right. Same webServer/database/proxy setup as
  # `e2e` — see that job's comments — just a different npm script.
  visual:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@db.localtest.me:4444/fabula_e2e
      NEON_FETCH_ENDPOINT: http://db.localtest.me:4444/sql
      AUTH_SECRET: ci-placeholder-secret
      E2E_NEON_PROXY_HOST: db.localtest.me:4444
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/fabula_e2e
        ports:
          - 4444:4444
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm i -g npm@11

      - run: npm ci

      - name: Wait for the Neon HTTP proxy
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4444/sql \
              -H "Content-Type: application/json" -d '{}' || true)
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "proxy responded with HTTP $code"
              exit 0
            fi
            sleep 1
          done
          echo "Neon HTTP proxy never became reachable at localhost:4444" >&2
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e:visual

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
